- !ingest
  - stream: Namespace
    event: !init_apply
      metadata: { name: default }
  - stream: Namespace
    event: !init_done
  - stream: Pod
    event: !init_apply
      metadata: { name: a, namespace: default, labels: { role: db } }
      spec: { nodeName: n1 }
      status: { podIPs: [{ ip: 10.0.0.1 }] }
  - stream: Pod
    event: !init_done
  - stream: NetworkPolicy
    event: !init_apply
      metadata: { name: default-deny-ingress, namespace: default }
      spec:
        podSelector: {}
        policyTypes: [Ingress]
  - stream: NetworkPolicy
    event: !init_done

- !verify |
    map pods_ingress {
    	type ipv4_addr : verdict
    	elements = { 10.0.0.1 : goto ingress_pod_default_a }
    }

    chain ingress_netpol_default_default-deny-ingress {
    }

    chain ingress_pod_default_a {
    	jump ingress_netpol_default_default-deny-ingress
    	counter packets 0 bytes 0 reject
    }

    chain pods_filter_ingress {
    	type filter hook forward priority filter; policy accept;
    	ct state established,related accept
    	ip daddr vmap @pods_ingress
    }
