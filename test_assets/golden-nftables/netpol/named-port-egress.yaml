# An egress named port resolves against each *peer* pod: two peer pods exposing
# the same named port on different container ports are matched on their own
# ports (`10.0.0.2 . tcp . 80`, `10.0.0.3 . tcp . 8080`), not the union.
- !ingest
  - stream: Namespace
    event: !init_apply
      metadata: { name: default }
  - stream: Namespace
    event: !init_done
  - stream: Pod
    event: !init_apply
      metadata: { name: a, namespace: default, labels: { role: db } }
      spec: { nodeName: n1 }
      status: { podIPs: [{ ip: 10.0.0.1 }] }
  - stream: Pod
    event: !init_apply
      metadata: { name: b, namespace: default, labels: { role: peer } }
      spec:
        nodeName: n1
        containers:
          - name: c
            ports:
              - { name: named-80-tcp, containerPort: 80, protocol: TCP }
      status: { podIPs: [{ ip: 10.0.0.2 }] }
  - stream: Pod
    event: !init_apply
      metadata: { name: c, namespace: default, labels: { role: peer } }
      spec:
        nodeName: n1
        containers:
          - name: c
            ports:
              - { name: named-80-tcp, containerPort: 8080, protocol: TCP }
      status: { podIPs: [{ ip: 10.0.0.3 }] }
  - stream: Pod
    event: !init_done
  - stream: NetworkPolicy
    event: !init_apply
      metadata: { name: named-egress, namespace: default }
      spec:
        podSelector: { matchLabels: { role: db } }
        policyTypes: [Egress]
        egress:
          - to:
              - podSelector: { matchLabels: { role: peer } }
            ports:
              - { protocol: TCP, port: named-80-tcp }
  - stream: NetworkPolicy
    event: !init_done

- !verify |
    map pods_egress {
    	type ipv4_addr : verdict
    	elements = { 10.0.0.1 : goto egress_pod_default_a }
    }

    set sel_bkdb5f5imjsnje9wbch7scfh4e_v4 {
    	type ipv4_addr
    	comment "default: role=peer"
    	elements = { 10.0.0.2, 10.0.0.3 }
    }

    chain egress_netpol_default_named-egress {
    	ip daddr . meta l4proto . th dport { 10.0.0.2 . tcp . 80, 10.0.0.3 . tcp . 8080 } ip daddr @sel_bkdb5f5imjsnje9wbch7scfh4e_v4 accept
    }

    chain egress_pod_default_a {
    	jump egress_netpol_default_named-egress
    	counter packets 0 bytes 0 reject
    }

    chain pods_filter_egress {
    	type filter hook forward priority filter + 10; policy accept;
    	ct state established,related accept
    	ip saddr vmap @pods_egress
    }
