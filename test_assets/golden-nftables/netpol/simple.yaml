- !ingest
  - stream: Namespace
    event: !init_done
  - stream: Pod
    event: !init_apply
      metadata:
        name: a
        namespace: default
        labels: { app: a }
      spec: { nodeName: n1 }
      status: { podIPs: [{ ip: 10.0.0.1 }] }
  - stream: Pod
    event: !init_apply
      metadata:
        name: b
        namespace: default
        labels: { app: b }
      spec: { nodeName: n1 }
      status: { podIPs: [{ ip: 10.0.0.2 }] }
  - stream: Pod
    event: !init_done
  - stream: NetworkPolicy
    event: !init_apply
      metadata: { name: np, namespace: default }
      spec:
        podSelector: { matchLabels: { app: a } }
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector: { matchLabels: { app: b } }
            ports:
              - protocol: TCP
                port: 80
              - protocol: TCP
                port: 443
              - protocol: UDP
          - from:
              - ipBlock: { cidr: 192.168.42.0/24, except: [192.168.42.5/32] }
  - stream: NetworkPolicy
    event: !init_done

- !verify |
    set np_default_np_i_1_pods_v4 {
    	type ipv4_addr
    	elements = { 10.0.0.2 }
    }

    map pods_ingress {
    	type ipv4_addr : verdict
    	elements = { 10.0.0.1 : goto ingress_pod_default_a }
    }

    chain ingress_pod_default_a {
    	jump ingress_netpol_default_np
    	reject
    }

    chain ingress_netpol_default_np {
    	meta l4proto . th dport { tcp . 80, tcp . 443, udp . 0-65535 } ip saddr @np_default_np_i_1_pods_v4 accept
    	ip saddr 192.168.42.0/24 ip saddr != { 192.168.42.5 } accept
    }

    chain pods_filter {
    	type filter hook forward priority filter; policy accept;
    	ct state established,related accept
    	ip daddr vmap @pods_ingress
    }
