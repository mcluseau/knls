# IPv6 named port: the rule binds an IPv6 destination to its container port
# (`ip6 daddr . meta l4proto . th dport`), exercising the 16-byte-first-field
# concatenation layout.
- !ingest
  - stream: Namespace
    event: !init_done
  - stream: Pod
    event: !init_apply
      metadata: { name: x1, namespace: x, labels: { app: a } }
      spec:
        nodeName: n1
        containers:
          - name: c
            ports:
              - { name: serve-80-tcp, containerPort: 80, protocol: TCP }
      status: { podIPs: [{ ip: 2001:db8::1 }] }
  - stream: Pod
    event: !init_done
  - stream: NetworkPolicy
    event: !init_apply
      metadata: { name: np, namespace: x }
      spec:
        podSelector: { matchLabels: { app: a } }
        policyTypes: [Ingress]
        ingress:
          - ports:
              - { protocol: TCP, port: serve-80-tcp }
  - stream: NetworkPolicy
    event: !init_done

- !verify |
    map pods_ingress6 {
    	type ipv6_addr : verdict
    	elements = { 2001:db8::1 : goto ingress_pod_x_x1 }
    }

    chain ingress_netpol_x_np {
    	ip6 daddr . meta l4proto . th dport { 2001:db8::1 . tcp . 80 } accept
    }

    chain ingress_pod_x_x1 {
    	jump ingress_netpol_x_np
    	reject
    }

    chain pods_filter {
    	type filter hook forward priority filter; policy accept;
    	ct state established,related accept
    	ip6 daddr vmap @pods_ingress6
    }
