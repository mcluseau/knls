# An egress rule with no `to` allows any destination: the named port resolves
# against every pod (`serve-80-tcp` -> tcp/80 on both `x/a` and `y/a`), so egress
# to either pod on port 80 is allowed while port 81 stays blocked.
- !ingest
  - stream: Namespace
    event: !init_apply
      metadata: { name: x }
  - stream: Namespace
    event: !init_apply
      metadata: { name: y }
  - stream: Namespace
    event: !init_done
  - stream: Pod
    event: !init_apply
      metadata: { name: a, namespace: x }
      spec:
        nodeName: n1
        containers:
          - name: c
            ports:
              - { name: serve-80-tcp, containerPort: 80, protocol: TCP }
              - { name: serve-81-tcp, containerPort: 81, protocol: TCP }
      status: { podIPs: [{ ip: 10.0.0.1 }] }
  - stream: Pod
    event: !init_apply
      metadata: { name: a, namespace: y }
      spec:
        nodeName: n1
        containers:
          - name: c
            ports:
              - { name: serve-80-tcp, containerPort: 80, protocol: TCP }
              - { name: serve-81-tcp, containerPort: 81, protocol: TCP }
      status: { podIPs: [{ ip: 10.0.0.2 }] }
  - stream: Pod
    event: !init_done
  - stream: NetworkPolicy
    event: !init_apply
      metadata: { name: allow-egress, namespace: x }
      spec:
        podSelector: {}
        policyTypes: [Egress]
        egress:
          - ports:
              - { protocol: TCP, port: serve-80-tcp }
  - stream: NetworkPolicy
    event: !init_done

- !verify |
    map pods_egress {
    	type ipv4_addr : verdict
    	elements = { 10.0.0.1 : goto egress_pod_x_a }
    }

    chain egress_netpol_x_allow-egress {
    	ip daddr . meta l4proto . th dport { 10.0.0.1 . tcp . 80, 10.0.0.2 . tcp . 80 } accept
    }

    chain egress_pod_x_a {
    	jump egress_netpol_x_allow-egress
    	counter packets 0 bytes 0 reject
    }

    chain pods_filter {
    	type filter hook forward priority filter; policy accept;
    	ct state established,related accept
    	ip saddr vmap @pods_egress
    }
