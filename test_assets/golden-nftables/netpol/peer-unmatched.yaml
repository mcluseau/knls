# A peer selector that matches no pod must fail closed: the rule matches
# nothing (the netpol chain stays empty), rather than allowing everything.
- !ingest
  - stream: Namespace
    event: !init_done
  - stream: Pod
    event: !init_apply
      metadata: { name: x1, namespace: x, labels: { app: a } }
      spec: { nodeName: n1 }
      status: { podIPs: [{ ip: 10.0.0.1 }] }
  - stream: Pod
    event: !init_done
  - stream: NetworkPolicy
    event: !init_apply
      metadata: { name: np, namespace: x }
      spec:
        podSelector: { matchLabels: { app: a } }
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector: { matchLabels: { app: nomatch } }
  - stream: NetworkPolicy
    event: !init_done

- !verify |
    map pods_ingress {
    	type ipv4_addr : verdict
    	elements = { 10.0.0.1 : goto ingress_pod_x_x1 }
    }

    chain ingress_netpol_x_np {
    }

    chain ingress_pod_x_x1 {
    	jump ingress_netpol_x_np
    	counter packets 0 bytes 0 reject
    }

    chain pods_filter {
    	type filter hook forward priority filter; policy accept;
    	ct state established,related accept
    	ip daddr vmap @pods_ingress
    }
