- !ingest
  - stream: Namespace
    event: !init_apply
      metadata: { name: default }
  - stream: Namespace
    event: !init_done
  - stream: Pod
    event: !init_apply
      metadata: { name: a, namespace: default, labels: { role: db } }
      spec: { nodeName: n1 }
      status: { podIPs: [{ ip: 10.0.0.1 }] }
  - stream: Pod
    event: !init_done
  - stream: NetworkPolicy
    event: !init_apply
      metadata: { name: multi-port-egress, namespace: default }
      spec:
        podSelector: { matchLabels: { role: db } }
        policyTypes: [Egress]
        egress:
          - to:
              - ipBlock: { cidr: 10.0.0.0/24 }
            ports:
              - protocol: TCP
                port: 32000
                endPort: 32768
  - stream: NetworkPolicy
    event: !init_done

- !verify |
    map pods_egress {
    	type ipv4_addr : verdict
    	elements = { 10.0.0.1 : goto egress_pod_default_a }
    }

    chain egress_pod_default_a {
    	jump egress_netpol_default_multi-port-egress
    	counter packets 0 bytes 0 reject
    }

    chain egress_netpol_default_multi-port-egress {
    	meta l4proto . th dport { tcp . 32000-32768 } ip daddr 10.0.0.0/24 accept
    }

    chain pods_filter {
    	type filter hook forward priority filter; policy accept;
    	ct state established,related accept
    	ip saddr vmap @pods_egress
    }
