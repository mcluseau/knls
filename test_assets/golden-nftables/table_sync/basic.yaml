- !verify |
    set blocked {
    	type ipv4_addr
    	flags interval
    	elements = { 192.168.1.0/24 }
    }

    map dispatch {
    	type ipv4_addr : verdict
    	elements = { 10.0.0.1 : goto pod_a }
    }

    set src {
    	type ipv4_addr
    	elements = { 10.0.0.1, 10.0.0.2 }
    }

    chain filter {
    	type filter hook forward priority filter; policy accept;
    	ip daddr @src accept
    	ip daddr vmap @dispatch
    }

    chain pod_a {
    	accept
    }

    chain pod_b {
    	meta l4proto . th dport { tcp . 80 } accept
    }

