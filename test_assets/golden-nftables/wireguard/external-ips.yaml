# The connectivity table's external-IP snat chain. The snat chain is present
# but empty here (masquerade disabled), as it shares the same table.
- !verify |
    set local_pods4 {
        type ipv4_addr
        flags interval
        comment "local pod CIDRs"
        elements = { 10.244.0.0/24 }
    }

    set local_pods6 {
        type ipv6_addr
        flags interval
        comment "local pod CIDRs"
        elements = { fd00::/64 }
    }

    chain external-ips {
        type nat hook postrouting priority srcnat; policy accept;
        oif 7 return
        ip saddr 10.244.0.5 snat ip to 203.0.113.5
        ip6 saddr fd00::1 snat ip6 to 2001:db8::5
    }

    chain snat {
        type nat hook postrouting priority 999; policy accept;
    }
