# From the `type: LoadBalancer` example in
# content/en/docs/concepts/services-networking/service.md: `my-service` on
# clusterIP 10.0.171.239, port 80 -> targetPort 9376, with an external load
# balancer IP reported in `.status.loadBalancer.ingress`.
#
# knls programs `spec.externalIPs`, not the status load-balancer ingress, so this
# pins that a LoadBalancer Service renders as its ClusterIP unless external IPs
# are set.
- !ingest
  - stream: MyNode
    event: !init_apply
      metadata: { name: n1 }
      spec: { podCIDRs: [10.244.0.0/24] }
      status:
        addresses:
          - { type: InternalIP, address: 192.168.1.10 }
  - stream: MyNode
    event: !init_done
  - stream: Service
    event: !init_apply
      metadata: { name: my-service, namespace: default }
      spec:
        type: LoadBalancer
        clusterIPs: [10.0.171.239]
        ports:
          - { protocol: TCP, port: 80, targetPort: 9376 }
      status:
        loadBalancer:
          ingress:
            - ip: 192.0.2.127
  - stream: EndpointSlice
    event: !init_apply
      metadata:
        name: my-service-1
        namespace: default
        labels: { "kubernetes.io/service-name": my-service }
      addressType: IPv4
      ports:
        - { protocol: TCP, port: 9376 }
      endpoints:
        - addresses: ["10.4.5.6"]
        - addresses: ["10.1.2.3"]
  - stream: Service
    event: !init_done
  - stream: EndpointSlice
    event: !init_done

- !verify |
    map svc_default_my-service {
    	typeof numgen random mod 1 : verdict
    	elements = { 0 : goto svc_default_my-service_ep_0a010203, 1 : goto svc_default_my-service_ep_0a040506 }
    }

    map service_ips {
    	type ipv4_addr . inet_proto . inet_service : verdict
    	comment "ClusterIP, ExternalIP and LoadBalancer IP traffic"
    	elements = { 10.0.171.239 . tcp . 80 : goto svc_default_my-service }
    }

    map service_nodeports {
    	type inet_proto . inet_service : verdict
    	comment "NodePort traffic"
    }

    set need_masquerade {
    	type ipv4_addr . ipv4_addr . ipv4_addr
    }

    set need_masquerade6 {
    	type ipv6_addr . ipv6_addr . ipv6_addr
    }

    chain svc_default_my-service_ep_0a010203 {
    	meta nfproto ipv4 tcp dport 80 meta mark set meta mark | 0x00004000 dnat ip to 10.1.2.3:9376
    }

    chain svc_default_my-service_ep_0a040506 {
    	meta nfproto ipv4 tcp dport 80 meta mark set meta mark | 0x00004000 dnat ip to 10.4.5.6:9376
    }

    chain svc_default_my-service {
    	meta nfproto ipv4 numgen random mod 2 vmap @svc_default_my-service
    	reject with icmpv6 port-unreachable
    }

    chain dispatch {
    	ip daddr . ip protocol . th dport vmap @service_ips
    	fib daddr type local ip protocol . th dport vmap @service_nodeports
    }

    chain a_hook_dnat_prerouting {
    	type nat hook prerouting priority filter; policy accept;
    	jump dispatch
    }

    chain a_hook_dnat_output {
    	type nat hook output priority filter; policy accept;
    	jump dispatch
    }

    chain a_hook_dnat_postrouting {
    	type nat hook postrouting priority filter; policy accept;
    	ip saddr . ip daddr . ct original ip daddr @need_masquerade masquerade
    	ip6 saddr . ip6 daddr . ct original ip6 daddr @need_masquerade6 masquerade
    	ip saddr 10.244.0.0/24 return
    	ip daddr 10.244.0.0/24 return
    	meta mark & 0x00004000 == 0x00000000 return
    	meta mark set meta mark ^ 0x00004000 masquerade fully-random
    }
