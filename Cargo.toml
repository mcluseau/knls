[package]
name = "knls"
version = "0.5.6"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true
debug = false
panic = "abort"

[lints.clippy]
unwrap_used = "deny"

[dependencies]
base32 = "0.5.1"
base64 = "0.23.1"
cidr = { version = "0.3.2", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
constcat = "0.6.1"
defguard_wireguard_rs = { version = "0.9.0", path = "./wireguard-rs" }
diff = "0.1.13"
env_logger = "0.11.11"
errno = "0.3.14"
eyre = "0.6.14"
futures = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
http = "1.5.0"
hxdmp = "0.2.1"
ipnetwork = "0.21.1"
itertools = "0.15.0"
k8s-openapi = { version = "0.28.0", features = ["earliest"] }
kube = { version = "4.2.0", features = ["aws-lc-rs", "runtime"] }
log = "0.4.34"
maxminddb = "0.32.0"
netlink-packet-core = "0.9.0"
netlink-packet-netfilter = "0.4.0"
netlink-packet-route = "0.33.0"
netlink-proto = "0.13.0"
nftnl = { git = "https://github.com/mcluseau/nftnl-rs.git", branch = "main" }
nix = { version = "0.31.3", features = ["socket"] }
rtnetlink = "0.23.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-pipe = "0.2.12"
urandom = "0.2.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zerocopy = { version = "0.8.57", features = ["derive"] }
zstd = "0.14.0"

