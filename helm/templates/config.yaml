---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knls-config
data:
  knls.yaml: |
{{- with .Values.cluster_url }}
    cluster_url: {{ . |quote }}
{{- end }}

{{- with .Values.extra_conf }}
{{ . |indent 4 }}
{{- end }}

    proxy: !nftables {}
{{- if .Values.dns }}
    dns: !{{.Values.dns}}
      cluster_domain: {{ .Values.cluster_domain |quote }}
      on_listen:
      - !nft_chain
        table: knls
        chain: dns
        rules: |-
          type nat hook prerouting priority -101; policy accept;
{{-   range .Values.service_ips }}
          ip daddr {{.}} udp dport 53 redirect;
{{-   end }}
{{- end }}

{{- if .Values.connectivity}}
    connectivity: !{{.Values.connectivity}}
{{-   if eq .Values.connectivity "wireguard" }}{{ with .Values.wireguard}}
      ifname: {{.ifname |quote}}
{{-     with .mtu}}
      mtu: {{.}}
{{-     end}}
      key_path: "/var/lib/knls/wireguard/{{.key}}"
{{-     if .host_ports}}
      host_ports: true
{{-     end}}
      masquerade: {{ .masquerade }}
      on_create:
      - !nft_chain
        table: knls
        chain: wireguard
        # Connectivity's masquerade lives in the `knls-connectivity` table now.
        # Recreate this config-owned chain empty so an upgrade cleans it up.
        rules: |-
          # empty; masquerade lives in the knls-connectivity table
{{-   end }}{{ end }}
{{- end }}
{{- if .Values.hw_labels}}
    hw_labels:
      disk_wwid: true
      part_uuid: true
{{- end }}
{{- if .Values.network_policy }}
    network_policy: !nftables {}
{{- end }}

  unbound.conf: |
    server:
{{ .Values.unbound.listen |indent 6 }}

      chroot: ""
      use-syslog: no
      verbosity: 1
      trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"
      qname-minimisation: yes
      do-not-query-localhost: no
      interface-automatic: yes

      domain-insecure: {{ .Values.cluster_domain |quote }}
      local-zone: {{ .Values.cluster_domain |quote }} nodefault
      {{- /* Reverse zones delegated to the (unsigned) knls DNS below. */}}
    {{- range .Values.service_cidrs }}
    {{- if and (contains "/" .) (not (contains ":" .)) }}
    {{- $spec := splitList "/" . }}
    {{- $n := div (int (last $spec)) 8 }}
    {{- $zone := printf "%s.in-addr.arpa" (join "." (reverse (slice (splitList "." (first $spec)) 0 $n))) }}
      domain-insecure: {{ $zone | quote }}
      {{- /*
      without `nodefault`, unbound's AS112 empty zone for the private reverse
      range shadows our stub-zone
      */}}
      local-zone: {{ $zone | quote }} nodefault
    {{- end }}
    {{- end }}
    {{- range (keys .Values.extra_zones) }}
      domain-insecure: {{ . |quote }}
      local-zone: {{ . |quote }} nodefault
    {{- end}}

{{ .Values.unbound.server_extra |indent 6 }}

    stub-zone:
      name: {{ .Values.cluster_domain |quote }}
      stub-addr: 127.0.0.1@1053
      stub-no-cache: yes

    {{- /*
    Delegate the reverse (`in-addr.arpa`) zones of the Service CIDR(s) to the
    knls DNS, which serves the PTR records for Service ClusterIPs.
    */}}
    {{- range .Values.service_cidrs }}
    {{- if and (contains "/" .) (not (contains ":" .)) }}
    {{- $spec := splitList "/" . }}
    {{- $n := div (int (last $spec)) 8 }}
    {{- $zone := printf "%s.in-addr.arpa" (join "." (reverse (slice (splitList "." (first $spec)) 0 $n))) }}
    stub-zone:
      name: {{ $zone | quote }}
      stub-addr: 127.0.0.1@1053
      stub-no-cache: yes
    {{- end }}
    {{- end }}

    {{- range (keys .Values.extra_zones) }}
    auth-zone:
      name: {{ . |quote }}
      zonefile: /zones/{{.}}
      for-downstream: no
    {{- end}}

{{ .Values.unbound.extra_conf |indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knls-zones
data:
{{ .Values.extra_zones |toYaml |indent 2 }}

