---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knls
  labels:
    app: knls
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: knls
  labels:
    app: knls
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  - pods
{{- if .Values.network_policy }}
  - namespaces
{{- end }}
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - list
  - get
  - watch
  - patch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
  - watch
{{- if .Values.network_policy }}
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - list
  - watch
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: knls
  labels:
    app: knls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: knls
subjects:
- kind: ServiceAccount
  name: knls
  namespace: {{ .Release.Namespace }}

