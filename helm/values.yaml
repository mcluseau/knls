
image:
  repo: docker.io/mcluseau/knls
  #tag: my-custom-tag

hostNetwork: true
nodeSelector: null

minReadySeconds: 60

# Conntrack sysctls set by a privileged initContainer before knls starts, in
# the host network namespace (the main container's /proc/sys is read-only).
# These match kube-proxy: a CLOSE_WAIT entry that expires too early drops the
# local FIN and can reset a new connection reusing the SNAT tuple
# (kubernetes/kubernetes#32551).
sysctls:
  net.netfilter.nf_conntrack_tcp_timeout_close_wait: 3600
  net.netfilter.nf_conntrack_tcp_timeout_established: 86400

#extra_conf: |-
#  on_start: ...
#
# a common requirement would be to masq pods' outgoing traffic; pods are usually connected with veth:
#  on_start:
#  - !nft_chain
#    table: knls
#    chain: masq-pods
#    rules: |-
#      type nat hook postrouting priority 999; policy accept;
#      ct status dnat return
#      meta iifkind "veth" oifname != "kwg" masquerade

#service_ips: [ 1.2.3.4 ]
# The cluster's Service (ClusterIP) CIDR(s); used e.g. to delegate their reverse
# DNS zones to knls, so PTR lookups for ClusterIPs resolve.
service_cidrs: []
cluster_domain: cluster.local
extra_zones: {}

# for direct connection:
#
#cluster_url: "https://kubernetes:6443"
#hostAliases:
#- { hostnames: [ kubernetes ], ip: 1.1.1.1 }
#- { hostnames: [ kubernetes ], ip: 2.2.2.2 }
#- { hostnames: [ kubernetes ], ip: 3.3.3.3 }

# values: null, wireguard
connectivity: null

wireguard:
  ifname: kwg
  key_dir: /var/lib/knls/wireguard
  key: wireguard.key
  # Chain the CNI `portmap` plugin so pods' `hostPort`s are reachable
  # (requires the `portmap` CNI plugin binary on the nodes).
  host_ports: false

dns: internal

unbound:
  listen: |
    interface: 0.0.0.0
    interface: ::0
  server_extra: |
    access-control: ::1/128        allow
    access-control: 127.0.0.0/8    allow
    access-control: 10.0.0.0/8     allow
    access-control: 172.16.0.0/12  allow
    access-control: 192.168.0.0/16 allow
    access-control: fd00::/8       allow
  extra_conf: ""

hw_labels: true

# values: null, nftables
network_policy: null

resources:
  knls:
    limits:
      memory: 32Mi
    requests:
      memory: 10Mi
      cpu: 10m
  unbound:
    limits:
      memory: 24Mi
    requests:
      memory: 12Mi
      cpu: 10m

